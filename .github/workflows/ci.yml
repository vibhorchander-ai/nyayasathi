name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-semantic.txt
      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: bge-small-en-v1.5-fastembed-0.9.1-${{ runner.os }}
      - name: Python behavior and real embedding tests
        env:
          NYAYA_TEST_SEMANTIC: '1'
        run: python -m unittest discover -s backend/tests -v
      - name: Reproduce retrieval evaluation
        run: python -m backend.evaluate --engine bge
      - name: Verify Python HTTP service
        run: |
          NYAYA_EMBEDDINGS=tfidf python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl --fail --silent --header 'Content-Type: application/json' --data '{"question":"How do I track my consumer complaint?","useAI":false}' http://127.0.0.1:8000/api/chat
