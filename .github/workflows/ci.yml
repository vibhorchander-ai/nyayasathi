name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-semantic.txt
      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: bge-small-en-v1.5-fastembed-0.9.1-${{ runner.os }}
      - name: Python behavior and real embedding tests
        env:
          NYAYA_TEST_SEMANTIC: '1'
        run: python -m unittest discover -s backend/tests -v
      - name: Reproduce retrieval evaluation
        run: python -m backend.evaluate --engine bge
      - name: Check embedding API memory for free hosting
        run: python scripts/check_backend_memory.py
      - name: Verify Python HTTP service
        run: |
          NYAYA_EMBEDDINGS=tfidf python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl --fail --silent --header 'Content-Type: application/json' --data '{"question":"How do I track my consumer complaint?","useAI":false}' http://127.0.0.1:8000/api/chat

  deploy:
    name: Deploy free demo
    needs: [check, python]
    # Opt-in only; PR code never receives deployment credentials.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == (vars.DEPLOY_BRANCH || 'feature/initial-setup')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nyayasathi-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      NYAYA_BACKEND_TOKEN: ${{ secrets.NYAYA_BACKEND_TOKEN }}
      NYAYA_BACKEND_URL: ${{ vars.NYAYA_BACKEND_URL }}
      NYAYA_PUBLIC_URL: ${{ vars.NYAYA_PUBLIC_URL }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration before changing hosting
        run: python scripts/deploy.py preflight
      - name: Install pinned pnpm and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Build the tested web commit
        run: pnpm build
      - name: Refuse to replace a newer branch commit with an older run
        run: |
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Deploy the same commit to Render and wait for readiness
        run: python scripts/deploy.py render
      - name: Deploy Cloudflare Worker and its backend secret
        run: python scripts/deploy.py cloudflare
      - name: Check public retrieval without using LLM quota
        run: python scripts/deploy.py smoke
